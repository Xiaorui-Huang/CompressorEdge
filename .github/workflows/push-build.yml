name: Build Debug APK on Push

# Personal/testing pipeline: builds a debug APK for pushes to any branch other
# than main (main is covered by the pull_request-triggered pr-build.yml, which
# is what upstream contribution PRs go through). Not a release workflow — no
# signing, no publishing, just a downloadable debug APK per push for quick
# manual testing on-device.
on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compute artifact-safe branch name
        id: safe_ref
        run: echo "name=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compressor-debug-${{ steps.safe_ref.outputs.name }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.safe_ref.outputs.name }}-${{ github.sha }}
          path: build.log
          retention-days: 14
