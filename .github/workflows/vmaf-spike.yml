name: VMAF spike - single-ABI libvmaf size/build check

# Throwaway measurement workflow for the A1 TODO item (see TODO.md "A1 - VMAF").
# Does NOT touch the app - it cross-compiles libvmaf for arm64-v8a only, outside the
# Gradle/AGP build, purely to get a real .so size number (the built-in models are compiled
# directly into that .so, not shipped as a separate asset - see TODO.md) and confirm the
# cross-build actually works before any app-side integration is attempted. Delete this
# workflow (and the feature/vmaf-spike branch) once A1's go/no-go decision is made.

on:
  push:
    branches:
      - feature/vmaf-spike
  workflow_dispatch:

jobs:
  vmaf-cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install NDK and build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm xxd pkg-config
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install requested NDK version via sdkmanager
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018"

      # Pinned by commit SHA (the commit tag v3.0.0 pointed to as of 2026-09-28) rather
      # than the mutable tag itself, so this build stays reproducible even if the tag
      # is ever force-moved upstream.
      - name: Checkout vmaf source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: Netflix/vmaf
          ref: 17a67b238ce0539bdeafdc95961abac64fa16ea8
          path: vmaf-src

      - name: Write Android arm64 meson cross file
        run: |
          NDK="$ANDROID_NDK_HOME"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          API=26
          cat > android-arm64.meson.cross <<EOF
          [binaries]
          c = '$TOOLCHAIN/bin/aarch64-linux-android${API}-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          # Deliberately no exe_wrapper: qemu-aarch64-static can't run these binaries anyway
          # (they're bionic-linked against the NDK's Android libc, not runnable by plain
          # user-mode qemu without the device's actual system libraries) - tried it, meson's
          # own compiler sanity check then fails outright with "Executables ... are not
          # runnable." Leaving exe_wrapper unset makes meson skip execution-dependent checks
          # instead, which is what this measurement-only build needs; any meson.build change
          # that later added a real cc.run()-based check would fail loudly and clearly at
          # configure time (not silently), so this is a safe, working tradeoff for a spike.
          needs_exe_wrapper = true
          EOF
          cat android-arm64.meson.cross

      - name: Configure + build libvmaf (release, -O3 - matches a typical production build)
        working-directory: vmaf-src/libvmaf
        run: |
          meson setup build-release \
            --cross-file ../../android-arm64.meson.cross \
            --default-library shared \
            -Denable_cuda=false \
            -Dbuilt_in_models=true \
            -Denable_avx512=false \
            -Denable_tests=false \
            -Denable_docs=false \
            -Dbuildtype=release
          ninja -C build-release

      # -Os is the number that actually matters for the fork's size budget; release and
      # minsize sizes are reported side by side below rather than picking one as "the" answer.
      - name: Configure + build libvmaf (minsize, -Os)
        working-directory: vmaf-src/libvmaf
        run: |
          meson setup build-minsize \
            --cross-file ../../android-arm64.meson.cross \
            --default-library shared \
            -Denable_cuda=false \
            -Dbuilt_in_models=true \
            -Denable_avx512=false \
            -Denable_tests=false \
            -Denable_docs=false \
            -Dbuildtype=minsize
          ninja -C build-minsize

      - name: Report sizes (release vs minsize, unstripped vs stripped)
        working-directory: vmaf-src/libvmaf
        run: |
          STRIP="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for variant in release minsize; do
            SO="build-$variant/src/libvmaf.so"
            echo "== $variant: unstripped =="
            ls -lh "$SO"
            cp "$SO" "/tmp/libvmaf-$variant.so"
            "$STRIP" "/tmp/libvmaf-$variant.so"
            echo "== $variant: stripped =="
            ls -lh "/tmp/libvmaf-$variant.so"
          done
          echo "== on-disk size of the 5 JSON models compiled into the .so (built_in_models=true) - reference only, not a separate shipped asset =="
          ls -lh ../model/vmaf_v0.6.1.json ../model/vmaf_v0.6.1neg.json ../model/vmaf_4k_v0.6.1.json ../model/vmaf_4k_v0.6.1neg.json ../model/vmaf_b_v0.6.3.json

      - name: Upload stripped .so variants as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libvmaf-arm64-v8a
          path: /tmp/libvmaf-*.so
